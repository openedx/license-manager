name: Django CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toxenv:
        - "py312-django42"
        - "py312-django52"
        - "translations"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        python-version: '3.12'

    - name: Install Dependencies
      run: uv sync --group ci

    - name: Run Tests
      env:
        TOXENV: ${{ matrix.toxenv }}
      run: uv run tox

    - name: Codecov
      if: startsWith(matrix.toxenv, 'py312-django')
      run: uv run --with codecov codecov

  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toxenv:
        - "quality"
        - "pii_check"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        python-version: '3.12'

    - name: Install Dependencies
      run: uv sync --group ci

    - name: Run Checks
      env:
        TOXENV: ${{ matrix.toxenv }}
      run: uv run tox
