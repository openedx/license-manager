name: Django CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toxenv:
        - "py312-django42"
        - "py312-django52"
        - "translations"
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: setup python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'
        architecture: x64

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

    - name: Install Dependencies
      run: uv sync --group ci

    - name: Run Tests
      env:
        TOXENV: ${{ matrix.toxenv }}
      run: uv run tox

    - name: Codecov
      if: startsWith(matrix.toxenv, 'py312-django')
      run: uv run --with codecov codecov

  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toxenv:
        - "quality"
        - "pii_check"
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: setup python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'
        architecture: x64

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

    - name: Install Dependencies
      run: uv sync --group ci

    - name: Run Checks
      env:
        TOXENV: ${{ matrix.toxenv }}
      run: uv run tox
