name: Migration check on MySql8

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

jobs:
  check_migrations:
    name: check migration for MySql8
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ 3.12 ]

    steps:
    - name: Checkout repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install system packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libxmlsec1-dev
    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Ubuntu and sql versions
      run: |
        lsb_release -a
        mysql -V
    - name: Install Python Dependencies
      run: |
        uv sync --group production --group mysql8 --no-binary-package mysqlclient --no-binary-package xmlsec
    - name: Initiate services
      run: |
        sudo /etc/init.d/mysql start
    - name: Reset mysql password
      run: |
        cat <<EOF | mysql -h 127.0.0.1 -u root --password=root
          UPDATE mysql.user SET authentication_string = null WHERE user = 'root';
          FLUSH PRIVILEGES;
        EOF
    - name: Run migrations
      env:
        DB_ENGINE: "django.db.backends.mysql"
        DB_NAME: "license_manager"
        DB_USER: root
        DB_PASSWORD:
        DB_HOST: localhost
        DB_PORT: 3306
      run: |
        echo "CREATE DATABASE IF NOT EXISTS license_manager;" | sudo mysql -u root
        echo "Running the migrations"
        uv run python manage.py migrate --settings=license_manager.settings.test
